<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>猫林奇遇</title>
    <style>
        /* 基础重置 */
        * { margin: 0; padding: 0; box-sizing: border-box; }

        /* 设置背景为森林深绿色渐变，拒绝纯色呆板 */
        body {
            height: 100vh;
            background: linear-gradient(135deg, #142814 0%, #2b4b2b 50%, #1e3f20 100%);
            color: #fdf5d3;
            font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* 顶部导航栏 - 极简半透明风格 */
        .navbar {
            height: 70px;
            background: rgba(0, 0, 0, 0.3);
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            border-bottom: 2px solid #4a6b4a;
        }

        .navbar a {
            color: #c2d6b3;
            text-decoration: none;
            font-size: 16px;
            padding: 8px 25px;
            border-radius: 20px;
            margin: 0 10px;
            transition: all 0.3s;
        }

        .navbar a.active, .navbar a:hover {
            background-color: #4a6b4a;
            color: #ffffff;
            box-shadow: 0 0 15px rgba(168, 209, 141, 0.4);
        }

        .author {
            position: absolute;
            right: 30px;
            font-size: 13px;
            color: #88a878;
            letter-spacing: 1px;
        }

        /* 主体布局：左右分栏 */
        .main-container {
            display: flex;
            flex: 1;
            padding: 50px 80px;
        }

        /* 左侧：文字和按钮 */
        .left-section {
            width: 50%;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

       .title {
    font-size: 120px;      
    color: #fdf5d3;
    letter-spacing: 2px;     
    margin-bottom: 15px;
    text-shadow: 0 0 20px rgba(168, 209, 141, 0.6), 4px 4px 0 #1a3a1a;
 
    transform: translate(40px, -60px); 
}

        .subtitle {
            font-size: 22px;
            color: #a8d18d;
            letter-spacing: 4px;
            margin-bottom: 60px;
            padding-left: 5px;
        }

        /* 按钮组 - 2x2 网格 */
        .btn-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            width: 460px;
        }

        .btn {
            background: rgba(43, 75, 43, 0.6);
            border: 2px solid #a8d18d;
            border-radius: 30px;
            color: #fdf5d3;
            font-size: 18px;
            padding: 15px 0;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
            letter-spacing: 2px;
            box-shadow: 0 4px 0 #1a3a1a;
        }

        .btn:hover {
            background: rgba(168, 209, 141, 0.3);
            color: #ffffff;
            transform: translateY(-2px);
            box-shadow: 0 6px 0 #1a3a1a, 0 0 15px rgba(168, 209, 141, 0.4);
        }

        /* 右侧：猫咪卡片展示区 */
        .right-section {
            width: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* 玻璃质感卡片 */
        .cat-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(168, 209, 141, 0.2);
            border-radius: 30px;
            padding: 40px;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 30px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.4);
        }

        /* 猫咪 Emoji */
        .cat {
            font-size: 50px;
            text-align: center;
            cursor: pointer;
            transition: transform 0.3s;
            /* 给Emoji加一点投影，显得更立体 */
            filter: drop-shadow(0 5px 10px rgba(0,0,0,0.5));
        }

        .cat:hover {
            transform: scale(1.3) rotate(5deg);
        }

    </style>
</head>
<body>

    <!-- 顶部导航 -->
    <nav class="navbar">
        <a href="#" class="active">首页</a>
        <a href="#">猫咪图鉴</a>
        <a href="#">森林地图</a>
        <a href="#">关于我们</a>
        <span class="author">计工本2502丁若桐web第一次作业</span>
    </nav>

    <!-- 主体内容 -->
    <main class="main-container">
        
        <!-- 左侧文字区 -->
        <section class="left-section">
            <h1 class="title">猫林奇遇</h1>
            <p class="subtitle">欢迎来到小猫森林</p>
            <div class="btn-group">
                <button class="btn">开始探索</button>
                <button class="btn">森林地图</button>
                <button class="btn">收集猫咪</button>
                <button class="btn">关于我们</button>
            </div>
        </section>

        <!-- 右侧猫咪区 -->
        <section class="right-section">
            <div class="cat-card">
                <div class="cat">🐱</div>
                <div class="cat">🐈</div>
                <div class="cat">🐈‍⬛</div>
                <div class="cat">😺</div>
                <div class="cat">😸</div>
                <div class="cat">😻</div>
                <div class="cat">🐱</div>
                <div class="cat">🐈</div>
                <div class="cat">🐈‍⬛</div>
                <div class="cat">😽</div>
                <div class="cat">🐱</div>
                <div class="cat">😻</div>
            </div>
        </section>

    </main>

</body>
</html>
